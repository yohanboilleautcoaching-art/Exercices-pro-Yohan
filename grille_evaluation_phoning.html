<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grille d'évaluation — Phoning supervisé</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1a3a5c;
    --blue-mid: #2d5f8a;
    --cyan: #00b4d8;
    --cyan-light: #e8f7fb;
    --orange: #e85d04;
    --orange-light: #fff3ee;
    --green: #2d7d4f;
    --green-light: #edf7f1;
    --grey: #f4f6f8;
    --border: #dde3ea;
    --text: #1a2535;
    --text-mid: #4a5568;
    --text-light: #8899aa;
    --white: #ffffff;
    --shadow: 0 2px 12px rgba(26,58,92,0.08);
    --shadow-lg: 0 8px 32px rgba(26,58,92,0.13);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #f0f4f8;
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px 64px;
  }

  .page {
    max-width: 860px;
    margin: 0 auto;
  }

  /* HEADER */
  .header {
    background: var(--blue);
    border-radius: 16px 16px 0 0;
    padding: 32px 40px 28px;
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content: '';
    position: absolute;
    right: -40px; top: -40px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: rgba(0,180,216,0.12);
  }
  .header-label {
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--cyan);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .header-title {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    color: var(--white);
    line-height: 1.2;
    margin-bottom: 24px;
  }
  .header-title em {
    color: var(--cyan);
    font-style: italic;
  }

  /* IDENTITÉS */
  .identites {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .id-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .id-field label {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    font-weight: 500;
  }
  .id-field input {
    background: rgba(255,255,255,0.1);
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    outline: none;
    transition: border-color 0.2s;
  }
  .id-field input::placeholder { color: rgba(255,255,255,0.3); }
  .id-field input:focus { border-color: var(--cyan); }

  /* BODY */
  .body {
    background: var(--white);
    border-radius: 0 0 16px 16px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }

  /* SECTION */
  .section {
    border-bottom: 1px solid var(--border);
  }
  .section:last-child { border-bottom: none; }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px 16px;
    background: var(--grey);
    border-bottom: 1px solid var(--border);
  }
  .section-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .section-num {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--blue);
    color: var(--white);
    font-size: 13px;
    font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .section-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--blue);
  }

  /* SCORE DISPLAY */
  .score-display {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .score-val {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: var(--blue);
    min-width: 40px;
    text-align: right;
  }
  .score-max {
    font-size: 13px;
    color: var(--text-light);
    font-weight: 400;
  }

  /* STARS */
  .stars {
    display: flex;
    gap: 4px;
    padding: 4px 0;
  }
  .star {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    background: var(--white);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-light);
    transition: all 0.15s;
    user-select: none;
  }
  .star:hover { border-color: var(--cyan); color: var(--cyan); transform: scale(1.1); }
  .star.active-1, .star.active-2 { background: #fee2e2; border-color: #ef4444; color: #ef4444; }
  .star.active-3 { background: #fef3c7; border-color: #f59e0b; color: #f59e0b; }
  .star.active-4, .star.active-5 { background: #d1fae5; border-color: #10b981; color: #10b981; }

  /* CRITÈRES */
  .criteres {
    padding: 16px 32px 20px;
  }
  .criteres-label {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-light);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .critere {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 5px 0;
    font-size: 13.5px;
    color: var(--text-mid);
    line-height: 1.4;
  }
  .critere::before {
    content: '›';
    color: var(--cyan);
    font-weight: 700;
    font-size: 16px;
    flex-shrink: 0;
    margin-top: -1px;
  }

  /* NOTATION ROW */
  .notation-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 32px 16px;
    background: var(--grey);
    border-top: 1px solid var(--border);
  }
  .notation-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* SCORE LEGEND */
  .legend {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .legend-item {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 500;
  }
  .legend-item.bad { background: #fee2e2; color: #ef4444; }
  .legend-item.mid { background: #fef3c7; color: #f59e0b; }
  .legend-item.good { background: #d1fae5; color: #10b981; }

  /* TOTAL */
  .total-section {
    background: var(--blue);
    padding: 24px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .total-label {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    color: var(--white);
  }
  .total-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .total-score {
    font-family: 'DM Serif Display', serif;
    font-size: 36px;
    color: var(--cyan);
  }
  .total-score span {
    font-size: 18px;
    color: rgba(255,255,255,0.5);
  }
  .total-badge {
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    background: rgba(255,255,255,0.1);
    color: var(--white);
    border: 1.5px solid rgba(255,255,255,0.2);
    min-width: 130px;
    text-align: center;
  }

  /* RÉSULTAT */
  .resultat-section {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
  }
  .resultat-title {
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-light);
    font-weight: 600;
    margin-bottom: 14px;
  }
  .resultat-options {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .resultat-btn {
    padding: 10px 20px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.15s;
  }
  .resultat-btn:hover { border-color: var(--blue); color: var(--blue); }
  .resultat-btn.active-rdv { background: var(--green-light); border-color: var(--green); color: var(--green); }
  .resultat-btn.active-rappel { background: var(--cyan-light); border-color: var(--cyan); color: var(--blue-mid); }
  .resultat-btn.active-suite { background: var(--orange-light); border-color: var(--orange); color: var(--orange); }

  /* DEBRIEF */
  .debrief-section {
    padding: 28px 32px;
  }
  .debrief-title {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    color: var(--blue);
    margin-bottom: 20px;
  }
  .debrief-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .debrief-col {}
  .debrief-col-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .debrief-col-title.positif { color: var(--green); }
  .debrief-col-title.amelio { color: var(--orange); }
  .debrief-col-title .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .debrief-col-title.positif .dot { background: var(--green); }
  .debrief-col-title.amelio .dot { background: var(--orange); }

  .debrief-item {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  .debrief-num {
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 10px;
  }
  .positif .debrief-num { background: var(--green-light); color: var(--green); }
  .amelio .debrief-num { background: var(--orange-light); color: var(--orange); }

  .debrief-input {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    color: var(--text);
    resize: none;
    outline: none;
    transition: border-color 0.2s;
    min-height: 44px;
    line-height: 1.5;
    overflow: hidden;
  }
  .debrief-input.positif-input:focus { border-color: var(--green); }
  .debrief-input.amelio-input:focus { border-color: var(--orange); }
  .debrief-input::placeholder { color: var(--text-light); }

  /* PRINT BUTTON */
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    padding: 24px 32px;
    border-top: 1px solid var(--border);
    background: var(--grey);
    border-radius: 0 0 16px 16px;
  }
  .btn {
    padding: 11px 24px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    border: none;
  }
  .btn-reset {
    background: var(--white);
    color: var(--text-mid);
    border: 1.5px solid var(--border);
  }
  .btn-reset:hover { border-color: var(--blue); color: var(--blue); }
  .btn-print {
    background: var(--blue);
    color: var(--white);
  }
  .btn-print:hover { background: var(--blue-mid); }

  @media print {
    body { background: white; padding: 0; }
    .actions { display: none; }
    .star { cursor: default; }
    .resultat-btn { cursor: default; }
    .page { max-width: 100%; }
    .header { border-radius: 0; }
    .body { border-radius: 0; box-shadow: none; }
  }

  @media (max-width: 600px) {
    .header { padding: 24px 20px 20px; }
    .identites { grid-template-columns: 1fr; }
    .section-header { padding: 16px 20px 12px; }
    .criteres { padding: 14px 20px 16px; }
    .notation-row { padding: 10px 20px 14px; flex-direction: column; align-items: flex-start; gap: 10px; }
    .total-section { padding: 20px; flex-direction: column; gap: 12px; text-align: center; }
    .debrief-cols { grid-template-columns: 1fr; }
    .debrief-section { padding: 20px; }
    .resultat-section { padding: 20px; }
    .actions { padding: 16px 20px; }
  }
</style>
</head>
<body>

<div class="page">

  <!-- HEADER -->
  <div class="header">
    <div class="header-label">Évaluation · Phoning supervisé</div>
    <div class="header-title">Grille d'observation<br><em>Cold call B2B</em></div>
    <div class="identites">
      <div class="id-field">
        <label>Prénom du commercial observé</label>
        <input type="text" id="observe" placeholder="Ex : Thomas">
      </div>
      <div class="id-field">
        <label>Prénom de l'observateur</label>
        <input type="text" id="observateur" placeholder="Ex : Marie">
      </div>
    </div>
  </div>

  <!-- BODY -->
  <div class="body">

    <!-- SECTIONS -->
    <div id="sections-container"></div>

    <!-- TOTAL -->
    <div class="total-section">
      <div class="total-label">Score total</div>
      <div class="total-right">
        <div class="total-score" id="total-display">0 <span>/ 25</span></div>
        <div class="total-badge" id="total-badge">—</div>
      </div>
    </div>

    <!-- RÉSULTAT -->
    <div class="resultat-section">
      <div class="resultat-title">Résultat de l'appel</div>
      <div class="resultat-options">
        <button class="resultat-btn" onclick="toggleResultat(this, 'active-rdv')">✓ RDV obtenu</button>
        <button class="resultat-btn" onclick="toggleResultat(this, 'active-rappel')">↺ Rappel planifié</button>
        <button class="resultat-btn" onclick="toggleResultat(this, 'active-suite')">— Sans suite</button>
      </div>
    </div>

    <!-- DÉBRIEF -->
    <div class="debrief-section">
      <div class="debrief-title">Débrief</div>
      <div class="debrief-cols">

        <div class="debrief-col positif">
          <div class="debrief-col-title positif">
            <div class="dot"></div>
            3 points forts
          </div>
          <div class="debrief-item">
            <div class="debrief-num">1</div>
            <textarea class="debrief-input positif-input" placeholder="Ce qui a bien fonctionné..." rows="2" oninput="autoResize(this)"></textarea>
          </div>
          <div class="debrief-item">
            <div class="debrief-num">2</div>
            <textarea class="debrief-input positif-input" placeholder="Ce qui a bien fonctionné..." rows="2" oninput="autoResize(this)"></textarea>
          </div>
          <div class="debrief-item">
            <div class="debrief-num">3</div>
            <textarea class="debrief-input positif-input" placeholder="Ce qui a bien fonctionné..." rows="2" oninput="autoResize(this)"></textarea>
          </div>
        </div>

        <div class="debrief-col amelio">
          <div class="debrief-col-title amelio">
            <div class="dot"></div>
            3 points d'amélioration
          </div>
          <div class="debrief-item">
            <div class="debrief-num">1</div>
            <textarea class="debrief-input amelio-input" placeholder="À améliorer..." rows="2" oninput="autoResize(this)"></textarea>
          </div>
          <div class="debrief-item">
            <div class="debrief-num">2</div>
            <textarea class="debrief-input amelio-input" placeholder="À améliorer..." rows="2" oninput="autoResize(this)"></textarea>
          </div>
          <div class="debrief-item">
            <div class="debrief-num">3</div>
            <textarea class="debrief-input amelio-input" placeholder="À améliorer..." rows="2" oninput="autoResize(this)"></textarea>
          </div>
        </div>

      </div>
    </div>

    <!-- ACTIONS -->
    <div class="actions">
      <button class="btn btn-reset" onclick="resetAll()">Réinitialiser</button>
      <button class="btn btn-print" onclick="savePDF()">Enregistrer en PDF</button>
    </div>

  </div>
</div>

<script>
const SECTIONS = [
  {
    num: 1,
    title: "Qualité de l'accroche",
    criteres: [
      "Le prospect est resté en ligne après 15 secondes",
      "L'accroche était personnalisée (signal, référence ou transparence)",
      "Le ton était naturel et assuré"
    ]
  },
  {
    num: 2,
    title: "Proposition de valeur",
    criteres: [
      "Le prospect a compris en quoi ça le concernait",
      "La mission a été énoncée en moins de 20 secondes",
      "L'objectif de l'appel a été annoncé clairement"
    ]
  },
  {
    num: 3,
    title: "Qualité de l'échange",
    criteres: [
      "Le prospect a parlé au moins autant que le commercial",
      "Des questions ouvertes ont été posées pour laisser le prospect s'exprimer",
      "Les questions posées étaient pertinentes et de qualité",
      "Une information utile a été obtenue",
      "Le commercial a adapté son discours à ce qu'il a entendu"
    ]
  },
  {
    num: 4,
    title: "Traitement des objections",
    criteres: [
      "Les objections réflexes sont traitées différemment des objections de fond",
      "Des questions ont été posées avant de répondre",
      "Le commercial n'a pas capitulé au premier signal",
      "Il a cherché à comprendre avant d'argumenter",
      "L'échange a pu continuer après l'objection"
    ]
  },
  {
    num: 5,
    title: "Conclusion de l'appel",
    criteres: [
      "Le commercial a remercié le prospect pour son temps",
      "Une prochaine étape est définie et datée",
      "Le prospect sait ce qui se passe après",
      "Le commercial sait quoi faire dans les 24 heures"
    ]
  }
];

const scores = [0, 0, 0, 0, 0];

function buildSections() {
  const container = document.getElementById('sections-container');
  SECTIONS.forEach((s, idx) => {
    const div = document.createElement('div');
    div.className = 'section';
    div.innerHTML = `
      <div class="section-header">
        <div class="section-left">
          <div class="section-num">${s.num}</div>
          <div class="section-title">${s.title}</div>
        </div>
        <div class="score-display">
          <div class="score-val" id="score-val-${idx}">0</div>
          <div class="score-max">/ 5</div>
        </div>
      </div>
      <div class="criteres">
        <div class="criteres-label">C'est réussi si...</div>
        ${s.criteres.map(c => `<div class="critere">${c}</div>`).join('')}
      </div>
      <div class="notation-row">
        <div class="notation-label">Note</div>
        <div style="display:flex;align-items:center;gap:16px">
          <div class="legend">
            <span class="legend-item bad">1-2 À retravailler</span>
            <span class="legend-item mid">3 Correct</span>
            <span class="legend-item good">4-5 Maîtrisé</span>
          </div>
          <div class="stars" id="stars-${idx}">
            ${[1,2,3,4,5].map(n => `<div class="star" onclick="setScore(${idx}, ${n})">${n}</div>`).join('')}
          </div>
        </div>
      </div>
    `;
    container.appendChild(div);
  });
}

function setScore(sectionIdx, val) {
  scores[sectionIdx] = val;
  const starsEl = document.getElementById(`stars-${sectionIdx}`);
  const stars = starsEl.querySelectorAll('.star');
  stars.forEach((s, i) => {
    s.className = 'star';
    if (i < val) s.classList.add(`active-${val}`);
  });
  document.getElementById(`score-val-${sectionIdx}`).textContent = val;
  updateTotal();
}

function updateTotal() {
  const total = scores.reduce((a, b) => a + b, 0);
  document.getElementById('total-display').innerHTML = `${total} <span>/ 25</span>`;
  const badge = document.getElementById('total-badge');
  if (total === 0) { badge.textContent = '—'; badge.style.background = 'rgba(255,255,255,0.1)'; }
  else if (total < 10) { badge.textContent = 'À retravailler'; badge.style.background = 'rgba(239,68,68,0.2)'; }
  else if (total < 16) { badge.textContent = 'En progression'; badge.style.background = 'rgba(245,158,11,0.2)'; }
  else if (total < 21) { badge.textContent = 'Intermédiaire'; badge.style.background = 'rgba(0,180,216,0.2)'; }
  else if (total < 24) { badge.textContent = 'Confirmé'; badge.style.background = 'rgba(45,125,79,0.25)'; }
  else { badge.textContent = 'Maîtrisé ✓'; badge.style.background = 'rgba(45,125,79,0.35)'; }
}

function toggleResultat(btn, activeClass) {
  const allBtns = document.querySelectorAll('.resultat-btn');
  allBtns.forEach(b => { b.className = 'resultat-btn'; });
  btn.classList.add(activeClass);
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function resetAll() {
  if (!confirm('Réinitialiser toute la grille ?')) return;
  document.getElementById('observe').value = '';
  document.getElementById('observateur').value = '';
  scores.fill(0);
  SECTIONS.forEach((_, idx) => {
    const stars = document.querySelectorAll(`#stars-${idx} .star`);
    stars.forEach(s => s.className = 'star');
    document.getElementById(`score-val-${idx}`).textContent = '0';
  });
  document.getElementById('total-display').innerHTML = '0 <span>/ 25</span>';
  document.getElementById('total-badge').textContent = '—';
  document.getElementById('total-badge').style.background = 'rgba(255,255,255,0.1)';
  document.querySelectorAll('.resultat-btn').forEach(b => b.className = 'resultat-btn');
  document.querySelectorAll('.debrief-input').forEach(t => { t.value = ''; t.style.height = 'auto'; });
}

function savePDF() {
  const observe = document.getElementById('observe').value || 'Commercial';
  const observateur = document.getElementById('observateur').value || 'Observateur';
  const original = document.title;
  document.title = `Evaluation_${observe}_par_${observateur}`;
  window.print();
  document.title = original;
}

buildSections();
</script>
</body>
</html>
